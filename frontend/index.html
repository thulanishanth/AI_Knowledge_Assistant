<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Knowledge Assistant - Debug UI</title>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; display: flex; height: 100vh; margin: 0; background-color: #f5f5f5; }
        #chat-container { width: 50%; display: flex; flex-direction: column; border-right: 2px solid #ddd; background: white; }
        #debug-container { width: 50%; background: #1e1e1e; color: #d4d4d4; display: flex; flex-direction: column; overflow-y: auto; }
        
        /* Chat Styles */
        #chat-history { flex: 1; padding: 20px; overflow-y: auto; display: flex; flex-direction: column; gap: 15px; }
        .msg { padding: 12px 16px; border-radius: 8px; max-width: 80%; line-height: 1.4; }
        .msg.user { background: #007bff; color: white; align-self: flex-end; }
        .msg.assistant { background: #f1f1f1; color: #333; align-self: flex-start; white-space: pre-wrap; }
        #input-area { padding: 20px; border-top: 1px solid #ddd; display: flex; gap: 10px; }
        input[type="text"] { flex: 1; padding: 12px; border: 1px solid #ccc; border-radius: 6px; font-size: 16px; }
        button { padding: 12px 24px; background: #007bff; color: white; border: none; border-radius: 6px; cursor: pointer; font-size: 16px; }
        button:hover { background: #0056b3; }

        /* Debug Styles */
        .debug-header { padding: 15px 20px; background: #2d2d2d; border-bottom: 1px solid #404040; font-weight: bold; color: #fff; }
        #debug-output { padding: 20px; font-family: monospace; white-space: pre-wrap; font-size: 13px; line-height: 1.5; }
        
        /* Syntax highlighting for JSON */
        .string { color: #ce9178; }
        .number { color: #b5cea8; }
        .boolean { color: #569cd6; }
        .null { color: #569cd6; }
        .key { color: #9cdcfe; }
    </style>
</head>
<body>

    <div id="chat-container">
        <div id="chat-history">
            <div class="msg assistant">Hello! I am your Database Assistant. Ask me a question, and watch the debug panel to see how I think!</div>
        </div>
        <div id="input-area">
            <input type="text" id="user-input" placeholder="Ask about hotel reservations..." onkeypress="handleKeyPress(event)">
            <button onclick="sendMessage()" id="send-btn">Send</button>
        </div>
    </div>

    <div id="debug-container">
        <div class="debug-header">🧠 LLM Internal State & RAG Inspector</div>
        <div id="debug-output">Submit a query to see the internal LLM context, intent, routing, and SQL...</div>
    </div>
<script>
    // 1. ADD THIS GLOBAL VARIABLE
    let currentSessionId = null; 

    // Syntax highlighting for JSON display
    function syntaxHighlight(json) {
        if (typeof json != 'string') { json = JSON.stringify(json, undefined, 2); }
        json = json.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
        return json.replace(/("(\\u[a-zA-Z0-9]{4}|\\[^u]|[^\\"])*"(\s*:)?|\b(true|false|null)\b|-?\d+(?:\.\d*)?(?:[eE][+\-]?\d+)?)/g, function (match) {
            var cls = 'number';
            if (/^"/.test(match)) {
                if (/:$/.test(match)) { cls = 'key'; } else { cls = 'string'; }
            } else if (/true|false/.test(match)) { cls = 'boolean'; } else if (/null/.test(match)) { cls = 'null'; }
            return '<span class="' + cls + '">' + match + '</span>';
        });
    }

    async function sendMessage() {
        const inputField = document.getElementById("user-input");
        const sendBtn = document.getElementById("send-btn");
        const chatHistory = document.getElementById("chat-history");
        const debugOutput = document.getElementById("debug-output");
        
        const text = inputField.value.trim();
        if (!text) return;

        chatHistory.innerHTML += `<div class="msg user">${text}</div>`;
        inputField.value = "";
        chatHistory.scrollTop = chatHistory.scrollHeight;
        
        sendBtn.innerText = "Thinking...";
        sendBtn.disabled = true;
        debugOutput.innerHTML = `<span style="color: #888;">Waiting for backend...</span>`;

        // 2. BUILD PAYLOAD WITH SESSION ID
        const payload = { question: text };
        if (currentSessionId) {
            payload.session_id = currentSessionId;
        }

        try {
            const response = await fetch("/api/chat/", {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify(payload) // 3. SEND UPDATED PAYLOAD
            });

            const data = await response.json();

            // 4. CAPTURE THE SESSION ID FROM THE FIRST RESPONSE
            if (data.session_id && !currentSessionId) {
                currentSessionId = data.session_id;
            }

            chatHistory.innerHTML += `<div class="msg assistant">${data.answer || "No text answer provided."}</div>`;
            chatHistory.scrollTop = chatHistory.scrollHeight;

            if(data.meta) {
                debugOutput.innerHTML = syntaxHighlight(data.meta);
            } else {
                debugOutput.innerHTML = `<span style="color: #f44336;">No meta data returned.</span>`;
            }

        } catch (error) {
            chatHistory.innerHTML += `<div class="msg assistant" style="color: red;">Error: ${error.message}</div>`;
            debugOutput.innerHTML = `<span style="color: red;">Fetch Error: ${error.message}</span>`;
        } finally {
            sendBtn.innerText = "Send";
            sendBtn.disabled = false;
        }
    }

    function handleKeyPress(e) {
        if (e.key === "Enter") sendMessage();
    }
</script>
    

</body>
</html>
